<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đi chơi với anh nhé ❤️</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
}

.container {
  width: 90%;
  max-width: 600px;
  text-align: center;
  padding: 45px 25px;
  border-radius: 30px;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(12px);
  box-shadow: 0 15px 50px rgba(120, 30, 80, 0.25);
  position: relative;
  z-index: 2;
}

.heart {
  font-size: 70px;
  animation: heartbeat 1.2s infinite;
  margin-bottom: 20px;
}

h1 {
  color: white;
  font-size: clamp(30px, 7vw, 52px);
  text-shadow: 0 4px 15px rgba(150, 30, 80, .3);
  margin-bottom: 20px;
}

.message {
  color: white;
  font-size: clamp(20px, 5vw, 28px);
  line-height: 1.6;
  font-weight: bold;
  text-shadow: 0 3px 10px rgba(100, 20, 60, .3);
}

.buttons {
  margin-top: 30px;
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}

button {
  border: none;
  padding: 14px 28px;
  border-radius: 999px;
  font-size: 18px;
  cursor: pointer;
  transition: .25s;
  font-weight: bold;
}

.yes {
  background: #ff4f81;
  color: white;
  box-shadow: 0 8px 20px rgba(255, 50, 110, .35);
}

.no {
  background: white;
  color: #ff4f81;
}

button:hover {
  transform: scale(1.08);
}

#answer {
  margin-top: 25px;
  color: white;
  font-size: 22px;
  font-weight: bold;
  min-height: 30px;
}

.floating-heart {
  position: fixed;
  bottom: -30px;
  color: rgba(255,255,255,.8);
  font-size: 20px;
  animation: floatUp linear forwards;
  pointer-events: none;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}

@keyframes floatUp {
  from {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }
  15% {
    opacity: 1;
  }
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="heart">❤️</div>

  <h1>Anh đang bận làm em</h1>

  <div class="message">
    Tối ko mưa thì mình đi chơi nhé ☔💕
    <br>
    Tầm 8h gì đó!
  </div>

  <div class="buttons">
    <button class="yes" onclick="yesAnswer()">
      e đồng ý ạ ❤️
    </button>

    <button class="no" onclick="noAnswer()">
      Để em suy nghĩ 😳
    </button>
  </div>

  <div id="answer"></div>
</div>

<script>
function yesAnswer() {
  document.getElementById("answer").innerHTML =
    "Yêu em nhất! 🥰❤️ Tối ko mưa mình đi chơi nhé!";
  createHearts(25);
}

function noAnswer() {
  document.getElementById("answer").innerHTML =
    "a xin thêm tgian suy nghĩ, còn tối thì làm cái 😝❤️";
  createHearts(10);
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "floating-heart";
  heart.innerHTML = ["❤️","💕","💗","💖","💘"][Math.floor(Math.random()*5)];

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (15 + Math.random() * 25) + "px";
  heart.style.animationDuration = (4 + Math.random() * 5) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 9000);
}

function createHearts(number) {
  for (let i = 0; i < number; i++) {
    setTimeout(createHeart, i * 100);
  }
}

setInterval(createHeart, 700);
</script>

</body>
</html>
